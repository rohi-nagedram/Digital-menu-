# Netlify Configuration for The Dark House Inn Restaurant
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect all routing to index.html for Single Page Application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets and dish photography for optimal mobile performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/dishes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
